<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="ICA — a minimalist endless typing arcade." />
    <title>ICA — Type. Focus. Repeat.</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Both fonts are used on the first screen: start downloading them in parallel with the JS. -->
    <link rel="preload" href="/fonts/manrope-latin-wght-v5.3.0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-mono-latin-400-v5.3.0.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Link previews. %SITE_URL% is filled at build time from Netlify's URL variable (empty locally). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ICA — Type. Focus. Repeat." />
    <meta property="og:description" content="A minimalist, endless typing arcade. One word at a time." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ICA — Type. Focus. Repeat." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
